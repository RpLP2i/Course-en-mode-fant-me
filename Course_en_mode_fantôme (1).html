<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Course en mode fantôme</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;overflow:hidden}
header{height:13vh;min-height:78px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#181818;border-bottom:2px solid #333}
h1{font-size:clamp(20px,3vw,38px);margin:0}
.team-total{font-size:clamp(20px,3vw,36px);font-weight:800;padding:8px 18px;border-radius:12px;background:#222}
#teamScore{font-size:1.15em}
.timer-area{height:29vh;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .25s;background:#16833a}
.timer-area.recovery{background:#a51f1f}
.phase{font-size:clamp(18px,2.8vw,32px);font-weight:800;text-transform:uppercase;letter-spacing:2px}
#timer{font-size:clamp(62px,12vw,145px);font-weight:900;line-height:1;margin:4px 0}
#roundInfo{font-size:clamp(16px,2.5vw,28px);font-weight:700}
.controls{position:absolute;right:18px;top:calc(13vh + 12px);display:flex;gap:8px}
button{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:800;cursor:pointer}
#startBtn{background:#fff;color:#111}
#pauseBtn{background:#ffd34d;color:#111}
#resetBtn{background:#ddd;color:#111}
.runners{height:58vh;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:#080808}
.runner{background:#202020;border-radius:12px;padding:10px;display:flex;flex-direction:column;min-width:0;border-top:7px solid #d71920}
.runner h2{margin:0 0 7px;text-align:center;font-size:clamp(18px,2.4vw,30px)}
.field{margin-bottom:7px}
label{display:block;font-size:13px;color:#bbb;margin-bottom:3px;font-weight:700}
select{width:100%;height:42px;border-radius:8px;border:2px solid #444;background:#111;color:#fff;font-size:18px;font-weight:700;text-align:center}
input.runner-name{width:100%;height:42px;border-radius:8px;border:2px solid #444;background:#111;color:#fff;font-size:18px;font-weight:700;text-align:center;padding:5px}
.validate{width:100%;margin-top:7px;background:#2bd45b;color:#061b0b;height:42px}
.validate:disabled{background:#555;color:#aaa}
.history{margin-top:7px;max-height:115px;overflow:auto;border-radius:8px;background:#111}
.history-row{display:grid;grid-template-columns:.55fr 1.3fr .7fr .7fr;gap:3px;padding:4px;border-bottom:1px solid #333;font-size:11px;text-align:center}
.history-row.header{font-weight:800;color:#aaa;position:sticky;top:0;background:#181818}
.export-area{position:absolute;left:18px;top:calc(13vh + 12px)}
#exportBtn{background:#70c7ff;color:#06131a}
@media(max-width:800px){.history{max-height:85px}.history-row{font-size:9px}}
.results{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:3px}
.results .field{margin:0}
.score{margin-top:auto;background:#111;border-radius:10px;padding:7px;text-align:center}
.score-label{font-size:12px;color:#aaa;text-transform:uppercase}
.score-value{font-size:clamp(28px,4vw,48px);font-weight:900}
.course-count{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:6px}
.dot{height:7px;border-radius:5px;background:#444}
.dot.done{background:#2bd45b}
.dot.current{background:#fff}
@media(max-width:800px){
 header{height:11vh}.timer-area{height:27vh}.runners{height:62vh}
 .controls{position:static;margin-top:5px}.controls button{padding:8px 10px;font-size:13px}
}
</style>
</head>
<body>
<header>
  <h1>🏃 COURSE EN MODE FANTÔME</h1>
  <div class="team-total">ÉQUIPE : <span id="teamScore">0</span> pts</div>
</header>

<section id="timerArea" class="timer-area">
  <div id="phase" class="phase">Prêt</div>
  <div id="timer">18:00</div>
  <div id="roundInfo">6 courses × 1'30 + 6 récupérations × 1'30</div>
  <div class="controls">
    <button id="startBtn">▶ DÉMARRER</button>
    <button id="pauseBtn">Ⅱ PAUSE</button>
    <button id="resetBtn">↺ RESET</button>
  </div>
  <div class="export-area">
    <button id="exportBtn">⬇ EXPORT CSV</button>
  </div>
</section>

<section class="runners" id="runners"></section>

<script>
const runnerNames=[""," ","  ","   "];
const zones=["Rouge -","Jaune -","Vert","Jaune +","Rouge +"];
const runnersEl=document.getElementById("runners");

function options(values, placeholder){
  return `<option value="">${placeholder}</option>`+values.map(v=>`<option value="${v}">${v}</option>`).join("");
}

function buildRunners(){
  runnersEl.innerHTML="";
  runnerNames.forEach((name,i)=>{
    const r=document.createElement("div");
    r.className="runner";
    r.innerHTML=`
      <div class="field">
        <label>Nom du coureur</label>
        <input class="runner-name" type="text" placeholder="Entrer le nom" value="">
      </div>
      <div class="field">
        <label>Contrat de course — km/h</label>
        <select class="speed">${options(Array.from({length:19},(_,j)=>j+7),"Choisir 7–25 km/h")}</select>
      </div>
      <div class="field">
        <label>Course / séquence</label>
        <select class="race">${options([1,2,3,4,5,6],"Choisir la course")}</select>
      </div>
      <div class="results">
        <div class="field">
          <label>Zone d'arrivée</label>
          <select class="zone">${options(zones,"Zone")}</select>
        </div>
        <div class="field">
          <label>Points gagnés</label>
          <select class="points">${options([0,1,2,3,4,5],"0–5")}</select>
        </div>
      </div>
      <button class="validate">✓ VALIDER LE RÉSULTAT</button>
      <div class="history">
        <div class="history-row header"><span>Course</span><span>Contrat</span><span>Zone</span><span>Pts</span></div>
        <div class="history-body"></div>
      </div>
      <div class="course-count">${Array.from({length:6},()=>'<div class="dot"></div>').join("")}</div>
      <div class="score">
        <div class="score-label">Total coureur</div>
        <div class="score-value">0</div>
      </div>`;
    runnersEl.appendChild(r);
  });
}
buildRunners();

const results = runnerNames.map(()=>[]);

function updateRunnerNames(){
  document.querySelectorAll(".runner").forEach((r,i)=>{
    const name=r.querySelector(".runner-name").value.trim() || `Coureur ${i+1}`;
    r.querySelector(".score-label").textContent=`Total ${name}`;
  });
}

function updateScores(){
  updateRunnerNames();
  let team=0;
  document.querySelectorAll(".runner").forEach((r,idx)=>{
    const score=results[idx].reduce((sum,x)=>sum+x.points,0);
    r.querySelector(".score-value").textContent=score;
    team+=score;
    const race=parseInt(r.querySelector(".race").value);
    r.querySelectorAll(".dot").forEach((d,i)=>{
      d.classList.toggle("current",race===i+1);
      d.classList.toggle("done",results[idx].some(x=>x.race===i+1));
    });
  });
  document.getElementById("teamScore").textContent=team;
}

function renderHistory(runnerIndex){
  const r=document.querySelectorAll(".runner")[runnerIndex];
  const body=r.querySelector(".history-body");
  body.innerHTML=results[runnerIndex].map(x=>`
    <div class="history-row">
      <span>${x.race}</span><span>${x.speed} km/h</span><span>${x.zone}</span><span>${x.points}</span>
    </div>`).join("");
}

function validateResult(runnerIndex){
  const r=document.querySelectorAll(".runner")[runnerIndex];
  const race=parseInt(r.querySelector(".race").value);
  const speed=r.querySelector(".speed").value;
  const zone=r.querySelector(".zone").value;
  const points=r.querySelector(".points").value;

  if(!race || !speed || !zone || points===""){
    alert("Complète le contrat, la course, la zone d'arrivée et les points avant de valider.");
    return;
  }
  if(results[runnerIndex].some(x=>x.race===race)){
    alert("Cette course est déjà validée pour ce coureur.");
    return;
  }

  results[runnerIndex].push({
    race, speed, zone, points:Number(points)
  });
  results[runnerIndex].sort((a,b)=>a.race-b.race);
  renderHistory(runnerIndex);
  updateScores();

  // Prépare automatiquement la course suivante
  const nextRace=results[runnerIndex].length<6 ? results[runnerIndex].length+1 : "";
  r.querySelector(".race").value=nextRace;
  r.querySelector(".speed").value="";
  r.querySelector(".zone").value="";
  r.querySelector(".points").value="";

  if(results[runnerIndex].length===6){
    r.querySelector(".validate").disabled=true;
    r.querySelector(".validate").textContent="✓ 6/6 VALIDÉS";
  }
}

document.querySelectorAll(".runner").forEach((r,idx)=>{
  r.querySelector(".validate").addEventListener("click",()=>validateResult(idx));
});

function csvEscape(v){
  const s=String(v ?? "");
  return '"' + s.replace(/"/g,'""') + '"';
}

function exportCSV(){
  const rows=[["Équipe","Coureur","Course","Contrat km/h","Zone d'arrivée","Points"]];
  document.querySelectorAll(".runner").forEach((r,i)=>{
    const name=r.querySelector(".runner-name").value.trim() || `Coureur ${i+1}`;
    results[i].forEach(x=>{
      rows.push(["Rouges",name,x.race,x.speed,x.zone,x.points]);
    });
  });
  if(rows.length===1){
    alert("Aucun résultat validé à exporter.");
    return;
  }
  const csv="\uFEFF"+rows.map(row=>row.map(csvEscape).join(";")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="Course_en_mode_fantôme_resultats.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById("exportBtn").addEventListener("click",exportCSV);

document.addEventListener("change",updateScores);
document.querySelectorAll(".runner-name").forEach(input=>{
  input.addEventListener("input",updateRunnerNames);
});
updateScores();

// Chronomètre : 12 phases de 1'30 = 18 min.
const phaseDuration=90;
let phaseIndex=0, remaining=90, running=false, timerId=null, beeped=false;

const timerEl=document.getElementById("timer");
const phaseEl=document.getElementById("phase");
const timerArea=document.getElementById("timerArea");
const roundInfo=document.getElementById("roundInfo");

function formatTime(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function renderTimer(){
  const isCourse=phaseIndex%2===0;
  timerArea.classList.toggle("recovery",!isCourse);
  phaseEl.textContent=isCourse ? "COURSE" : "RÉCUPÉRATION";
  timerEl.textContent=formatTime(remaining);
  const courseNumber=Math.floor(phaseIndex/2)+1;
  roundInfo.textContent=isCourse
    ? `Course ${courseNumber} / 6`
    : `Récupération ${courseNumber} / 6`;
}
function beep(){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    const ctx=new AudioContext();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sine"; osc.frequency.value=880;
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.35,ctx.currentTime+.02);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.55);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+.6);
  }catch(e){}
}
function startTimer(){
  if(running)return;
  running=true;
  document.getElementById("startBtn").textContent="▶ EN COURS";
  timerId=setInterval(()=>{
    if(remaining===45 && !beeped){ beep(); beeped=true; }
    if(remaining<=0){
      beep();
      phaseIndex++;
      if(phaseIndex>=12){
        clearInterval(timerId);timerId=null;running=false;
        phaseIndex=0;remaining=90;beeped=false;
        phaseEl.textContent="TERMINÉ";
        timerEl.textContent="18:00";
        roundInfo.textContent="Les 18 minutes sont terminées";
        timerArea.classList.remove("recovery");
        return;
      }
      remaining=90;beeped=false;
      renderTimer();
    }else{
      remaining--;
      renderTimer();
    }
  },1000);
}
function pauseTimer(){
  if(!running)return;
  running=false;clearInterval(timerId);timerId=null;
  document.getElementById("startBtn").textContent="▶ REPRENDRE";
}
function resetTimer(){
  running=false;clearInterval(timerId);timerId=null;
  phaseIndex=0;remaining=90;beeped=false;
  document.getElementById("startBtn").textContent="▶ DÉMARRER";
  renderTimer();
}
document.getElementById("startBtn").onclick=startTimer;
document.getElementById("pauseBtn").onclick=pauseTimer;
document.getElementById("resetBtn").onclick=resetTimer;
renderTimer();
updateScores();
</script>
</body>
</html>
